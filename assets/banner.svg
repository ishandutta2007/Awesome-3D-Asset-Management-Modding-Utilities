<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Glowing filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="orbGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35" />
    </filter>

    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
      <circle cx="40" cy="40" r="1.5" fill="rgba(56, 189, 248, 0.15)" />
    </pattern>

    <style>
      .title-text {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: url(#primaryGrad);
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .tagline-text {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-weight: 400;
        font-size: 14px;
        fill: #64748b;
      }
      .pill-text {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-size: 13px;
        font-weight: 600;
        fill: #e2e8f0;
      }
      .stat-number {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-size: 22px;
        font-weight: 700;
        fill: #38bdf8;
      }
      .stat-label {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-size: 12px;
        font-weight: 500;
        fill: #64748b;
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(3deg); }
      }
      @keyframes pulseOrb {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.15); }
      }
      @keyframes wireframeSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -40; }
      }
      .animated-float {
        animation: floatSlow 8s ease-in-out infinite;
      }
      .animated-orb {
        animation: pulseOrb 6s ease-in-out infinite;
        transform-origin: center;
      }
      .animated-cube {
        animation: wireframeSpin 24s linear infinite;
        transform-origin: 1040px 190px;
      }
      .dynamic-line {
        stroke-dasharray: 6, 6;
        animation: flowDash 3s linear infinite;
      }
    </style>
  </defs>

  <!-- Base background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle cx="150" cy="80" r="120" fill="#38bdf8" filter="url(#orbGlow)" class="animated-orb" />
  <circle cx="1060" cy="200" r="140" fill="#818cf8" filter="url(#orbGlow)" class="animated-orb" style="animation-delay: -3s;" />
  <circle cx="650" cy="380" r="100" fill="#c084fc" filter="url(#orbGlow)" class="animated-orb" style="animation-delay: -1.5s;" />

  <!-- Dynamic Animated Decorative Connecting Lines -->
  <path d="M 50 140 Q 400 40 850 120 T 1150 90" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="2" class="dynamic-line" />
  <path d="M 80 340 Q 550 420 950 310 T 1160 330" fill="none" stroke="rgba(192, 132, 252, 0.2)" stroke-width="2" class="dynamic-line" style="animation-duration: 4s;" />

  <!-- 3D Isometric Wireframe Graphic (Right Side Background Element) -->
  <g class="animated-cube">
    <!-- Outer hexagon wireframe -->
    <polygon points="1040,110 1120,150 1120,230 1040,270 960,230 960,150" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.6" />
    <!-- Inner cube lines -->
    <line x1="1040" y1="190" x2="1040" y2="110" stroke="#38bdf8" stroke-width="2" opacity="0.8" />
    <line x1="1040" y1="190" x2="1120" y2="230" stroke="#38bdf8" stroke-width="2" opacity="0.8" />
    <line x1="1040" y1="190" x2="960" y2="230" stroke="#38bdf8" stroke-width="2" opacity="0.8" />
    <circle cx="1040" cy="190" r="5" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="1040" cy="110" r="3.5" fill="#c084fc" />
    <circle cx="1120" cy="150" r="3.5" fill="#c084fc" />
    <circle cx="1120" cy="230" r="3.5" fill="#c084fc" />
    <circle cx="1040" cy="270" r="3.5" fill="#c084fc" />
    <circle cx="960" cy="230" r="3.5" fill="#c084fc" />
    <circle cx="960" cy="150" r="3.5" fill="#c084fc" />
  </g>

  <!-- Floating 3D Node Card (Decorative) -->
  <g class="animated-float" style="transform-origin: 940px 90px;">
    <rect x="880" y="65" width="130" height="42" rx="8" fill="rgba(17, 24, 39, 0.75)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.5" filter="url(#glow)" />
    <circle cx="902" cy="86" r="6" fill="#10b981" />
    <text x="918" y="91" class="pill-text" font-size="12">VFS Injected</text>
  </g>

  <g class="animated-float" style="transform-origin: 1060px 320px; animation-delay: -4s;">
    <rect x="990" y="295" width="145" height="42" rx="8" fill="rgba(17, 24, 39, 0.75)" stroke="rgba(192, 132, 252, 0.35)" stroke-width="1.5" filter="url(#glow)" />
    <circle cx="1012" cy="316" r="6" fill="#818cf8" />
    <text x="1028" y="321" class="pill-text" font-size="12">GLTF / USD 3D</text>
  </g>

  <!-- Foreground Content: Strict Visibility & High Contrast -->
  <g transform="translate(80, 0)">
    <!-- Top Badge / Category Pill -->
    <g transform="translate(0, 50)">
      <rect x="0" y="0" width="265" height="30" rx="15" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
      <circle cx="15" cy="15" r="4.5" fill="#38bdf8" />
      <text x="28" y="20" class="pill-text" fill="#38bdf8" font-size="12">CURATED ECOSYSTEM DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="132" class="title-text">Awesome 3D Asset Management</text>
    <text x="0" y="180" class="title-text">&amp; Modding Utilities 🎮✨</text>

    <!-- Subtitle & Description -->
    <text x="0" y="222" class="subtitle-text">Curated SaaS Platforms, VFS Loaders, Mesh Pipelines &amp; Open-Source Tools</text>
    <text x="0" y="254" class="tagline-text">From Game Mod Hubs &amp; Virtual File Systems to Local AI 3D Mesh Generation &amp; Self-Hosted DAMs</text>

    <!-- Feature Pills in Foreground -->
    <g transform="translate(0, 288)">
      <!-- Pill 1 -->
      <g>
        <rect x="0" y="0" width="168" height="36" rx="18" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="20" y="23" class="pill-text">📦 Game Mod Distribution</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(180, 0)">
        <rect x="0" y="0" width="165" height="36" rx="18" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="20" y="23" class="pill-text">⚡ VFS Load-Order Engines</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(358, 0)">
        <rect x="0" y="0" width="158" height="36" rx="18" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="20" y="23" class="pill-text">🎨 3D Digital Asset DAMs</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(528, 0)">
        <rect x="0" y="0" width="160" height="36" rx="18" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="20" y="23" class="pill-text">🤖 Local GPU Mesh AI</text>
      </g>
    </g>

    <!-- Metrics Bar / Footer Stats inside Banner -->
    <g transform="translate(0, 348)">
      <line x1="0" y1="0" x2="680" y2="0" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <g transform="translate(0, 18)">
        <text x="0" y="20" class="stat-number">100%</text>
        <text x="65" y="19" class="stat-label">OPEN &amp; CURATED</text>
      </g>
      <g transform="translate(220, 18)">
        <text x="0" y="20" class="stat-number">25+</text>
        <text x="50" y="19" class="stat-label">MODDING TOOLS</text>
      </g>
      <g transform="translate(420, 18)">
        <text x="0" y="20" class="stat-number">200K+</text>
        <text x="75" y="19" class="stat-label">GITHUB STARS</text>
      </g>
    </g>
  </g>
</svg>
